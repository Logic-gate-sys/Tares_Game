

events {}
user nginx;

http {
  log_format custom_log '"Request: $request\n Status: $status\n Request_URI: $request_uri\n Host: $host\n Client_IP: $remote_addr\n Proxy_IP(s): $proxy_add_x_forwarded_for\n Proxy_Hostname: $proxy_host\n Real_IP: $http_x_real_ip\n User_Client: $http_user_agent"';

  # The services proxy routes to which the outside world cannot see
  upstream user_service { server user-service:3000; }
  upstream wss_service { server wss-service:8081; }
  # upstream merch_service {server merch_service:4000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
  # Proxy server
  server {
    listen 80 default_server;
    server_name www.taresgames.com;
    # location for all logs generate from this reverse proxy
    access_log /var/log/nginx/custom-access-logs.log custom_log;

    location /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }
    # WSS and Rooms runs on the same server
    location /ws/ {
      proxy_pass http://wss_service/ws;  # Proxied location
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }
    location /rooms/ {
      proxy_pass http://wss_service/rooms;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization $http_authorization;
    }

    # All requests that should be proxied to the user microservice
    location /userapi/v1/ {
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
    }
  }
}
