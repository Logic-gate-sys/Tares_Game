

events {}
user nginx;

http {
  log_format custom_log '$remote_addr [$time_local] "$request_method $uri" $status '
                      '$body_bytes_sent "$http_user_agent" upstream=$upstream_addr';
  # The services proxy routes to which the outside world cannot see
  upstream user_service { server user-service:3000; }
  upstream wss_service { server wss-service:8081; }
  # upstream merch_service {server merch_service:4000; }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
  # Proxy server
  server {
    listen 80 default_server;
    server_name www.taresgames.com;
    # location for all logs generate from this reverse proxy
    access_log /var/log/nginx/custom-access-logs.log custom_log;
    access_log /dev/stdout custom_log;

    location /health {
      access_log on;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Game microservice proxied
    location /api/v1/ws {
         proxy_pass http://wss_service;
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection $connection_upgrade;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_read_timeout 86400s;
         proxy_send_timeout 86400s;
       }
    location /api/v1/rooms {
         proxy_pass http://wss_service;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
       }


       # User microservice proxied
    location /api/v1/auth {
         proxy_pass http://user_service;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
       }

       location /api/v1/users {
         proxy_pass http://user_service;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
       }

       location /api/v1/docs {
         proxy_pass http://user_service;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
       }
     }
}
