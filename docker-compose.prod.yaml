services:
  user-db:
    ports: []
    restart: unless-stopped
  game-db:
    ports: []
    restart: unless-stopped
  redis:
    ports: []
    restart: unless-stopped
  user-service:
    ports: []
    restart: unless-stopped
  wss-service:
    ports: []
    restart: unless-stopped
  nginx:
    image: nginx:1.29-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [user-service, wss-service]
    restart: unless-stopped
    profiles: ["prod"]
