name: 'Build backend containers'
description: 'Builds the user and WebSocket service containers'


runs:
  using: "composite"
  steps:
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: backend_platform/user_microservice/Dockerfile
        tags: tares-user-service:ci
        load: true
    - uses: docker/build-push-action@v6
      with:
        context: backend_platform/wss_microservice
        file: backend_platform/wss_microservice/Dockerfile
        tags: tares-wss-service:ci
        load: true