name: CI

on:
  workflow_call:      # called by deploy.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
  # No push trigger: deploy.yml calls this workflow on main, so it would run twice otherwise.

# Cancel superseded runs on pull requests only. Never cancel a run on main,
# because deploy.yml reuses this workflow and a cancelled run could be mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test -- --run

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-client
        with:
          api-url: ${{ vars.API_BASE_URL }}

  user-service:
    name: User service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/user_microservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/user_microservice/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test -- --run

  wss-service:
    name: WSS service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/wss_microservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/wss_microservice/go.sum
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./...

  docker:
    name: Build docker backend images
    needs: [user-service, wss-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build_backend
        with:
          registry: tares-local   # local-only name, nothing is pushed
          tag: ci