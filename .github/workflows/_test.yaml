name: Reusable Test Phase
on: 
  workflow_call:
    inputs:
        run_frontend:
          required: true
          type: boolean
        run_backend:
          required: true
          type: boolean

jobs:
  test-frontend:
    if: ${{inputs.run_frontend}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
        working-directory: web-client
      - run: npm test -- --run
        working-directory: web-client

  test-backend:
    if: ${{inputs.run_backend}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # setup-go@v5 automatically monitors  go.sum file for caching out-of-the-box.
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26
          cache-dependency-path: backend_platform/wss_microservice/go.sum
      - run: go test ./...
        working-directory: backend_platform/wss_microservice
      - run: go test -race ./...
        working-directory: backend_platform/wss_microservice