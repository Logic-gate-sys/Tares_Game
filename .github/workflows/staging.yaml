name: Build and deploy

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tares-deployment-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  checks:
    uses: ./.github/workflows/CI.yaml

  publish-backend:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Set image tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push user service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/user_microservice/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/tares-user-service:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAMESPACE }}/tares-user-service:${{ github.ref_name }}

      - name: Build and push WebSocket service
        uses: docker/build-push-action@v6
        with:
          context: backend/wss_microservice
          file: backend/wss_microservice/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/tares-wss-service:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAMESPACE }}/tares-wss-service:${{ github.ref_name }}

  deploy-ec2:
    needs: publish-backend
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_KEY" > ~/.ssh/tares_ec2
          chmod 600 ~/.ssh/tares_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy deployment files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/tares_ec2 "$EC2_USER@$EC2_HOST" "mkdir -p ~/tares-platform/backend/wss_microservice/internals/dictionary"
          scp -i ~/.ssh/tares_ec2 \
            docker-compose.yaml docker-compose.prod.yaml nginx.conf \
            "$EC2_USER@$EC2_HOST:~/tares-platform/"
          scp -i ~/.ssh/tares_ec2 \
            backend/wss_microservice/internals/dictionary/game_words.txt \
            "$EC2_USER@$EC2_HOST:~/tares-platform/backend/wss_microservice/internals/dictionary/"

      - name: Create runtime environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME }}
          USER_DB_USER: ${{ secrets.USER_DB_USER }}
          USER_DB_PASSWORD: ${{ secrets.USER_DB_PASSWORD }}
          USER_DB_NAME: ${{ secrets.USER_DB_NAME }}
          GAME_DB_USER: ${{ secrets.GAME_DB_USER }}
          GAME_DB_PASSWORD: ${{ secrets.GAME_DB_PASSWORD }}
          GAME_DB_NAME: ${{ secrets.GAME_DB_NAME }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          umask 077
          cat > .env.deploy <<EOF
          USER_SERVICE_IMAGE=${{ env.IMAGE_NAMESPACE }}/tares-user-service:${{ needs.publish-backend.outputs.tag }}
          WSS_SERVICE_IMAGE=${{ env.IMAGE_NAMESPACE }}/tares-wss-service:${{ needs.publish-backend.outputs.tag }}
          USER_DB_USER=$USER_DB_USER
          USER_DB_PASSWORD=$USER_DB_PASSWORD
          USER_DB_NAME=$USER_DB_NAME
          GAME_DB_USER=$GAME_DB_USER
          GAME_DB_PASSWORD=$GAME_DB_PASSWORD
          GAME_DB_NAME=$GAME_DB_NAME
          AUTH_SECRET=$AUTH_SECRET
          CLOUDINARY_URL=$CLOUDINARY_URL
          ALLOWED_ORIGINS=$ALLOWED_ORIGINS
          EOF
          scp -i ~/.ssh/tares_ec2 .env.deploy "$EC2_USER@$EC2_HOST:~/tares-platform/.env"
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh -i ~/.ssh/tares_ec2 "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin"

      - name: Deploy immutable images
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/tares_ec2 "$EC2_USER@$EC2_HOST" \
            "cd ~/tares-platform && \
             docker compose --env-file .env -f docker-compose.yaml -f docker-compose.prod.yaml --profile prod pull && \
             docker compose --env-file .env -f docker-compose.yaml -f docker-compose.prod.yaml --profile prod up -d --remove-orphans"
