name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR owner
        id: ghcr
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "registry=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build_backend
        with:
          registry: ${{ steps.ghcr.outputs.registry }}
          tag: ${{ github.sha }}
          push: "true"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: client/dist

      - name: Upload frontend to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.REGION }}
        run: |
          aws s3 sync client/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete

      - name: Deploy backend to EC2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.REGION }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          USER_DB_USER: ${{ secrets.USER_DB_USER }}
          USER_DB_PASSWORD: ${{ secrets.USER_DB_PASSWORD }}
          USER_DB_NAME: ${{ secrets.USER_DB_NAME }}
          GAME_DB_USER: ${{ secrets.GAME_DB_USER }}
          GAME_DB_PASSWORD: ${{ secrets.GAME_DB_PASSWORD }}
          GAME_DB_NAME: ${{ secrets.GAME_DB_NAME }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          ALLOWED_ORIGINS: ${{ vars.FRONTEND_URL }}
        run: |
          set -euo pipefail
          IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          encode() { base64 -w0 "$1"; }
          compose_b64=$(encode docker-compose.yaml)
          prod_b64=$(encode docker-compose.prod.yaml)
          nginx_b64=$(encode nginx.conf)
          username_b64=$(printf '%s' "$GHCR_USERNAME" | base64 -w0)
          token_b64=$(printf '%s' "$GHCR_READ_TOKEN" | base64 -w0)
          env_file=$(printf '%s\n' \
            "USER_SERVICE_IMAGE=ghcr.io/${IMAGE_OWNER}/tares-user-service:${GITHUB_SHA}" \
            "WSS_SERVICE_IMAGE=ghcr.io/${IMAGE_OWNER}/tares-wss-service:${GITHUB_SHA}" \
            "USER_DB_USER=${USER_DB_USER}" "USER_DB_PASSWORD=${USER_DB_PASSWORD}" \
            "USER_DB_NAME=${USER_DB_NAME}" "GAME_DB_USER=${GAME_DB_USER}" \
            "GAME_DB_PASSWORD=${GAME_DB_PASSWORD}" "GAME_DB_NAME=${GAME_DB_NAME}" \
            "AUTH_SECRET=${AUTH_SECRET}" "CLOUDINARY_URL=${CLOUDINARY_URL}" \
            "ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" \
            "NODE_ENV=production" "SERVER_PORT=3000" "JWT_EXPIRES_IN=7d" \
            "WSS_PORT=8081" "USER_GRPC_ADDR=user-service:50051" \
            "USER_SERVICE_URL=http://user-service:3000" \
            "DICTIONARY_FILEPATH=game_words.txt")
          env_b64=$(printf '%s' "$env_file" | base64 -w0)
          command=$(jq -n \
            --arg compose "$compose_b64" --arg prod "$prod_b64" --arg nginx "$nginx_b64" \
            --arg env "$env_b64" --arg user "$username_b64" --arg token "$token_b64" \
            '{commands: [
              "mkdir -p /opt/tares",
              ("echo " + $compose + " | base64 -d > /opt/tares/docker-compose.yaml"),
              ("echo " + $prod + " | base64 -d > /opt/tares/docker-compose.prod.yaml"),
              ("echo " + $nginx + " | base64 -d > /opt/tares/nginx.conf"),
              ("echo " + $env + " | base64 -d > /opt/tares/.env"),
              ("echo " + $token + " | base64 -d | docker login ghcr.io --username \"$(echo " + $user + " | base64 -d)\" --password-stdin"),
              "cd /opt/tares && docker compose --env-file .env -f docker-compose.yaml -f docker-compose.prod.yaml --profile prod config --quiet",
              "cd /opt/tares && docker compose --env-file .env -f docker-compose.yaml -f docker-compose.prod.yaml --profile prod pull",
              "cd /opt/tares && docker compose --env-file .env -f docker-compose.yaml -f docker-compose.prod.yaml --profile prod up -d --remove-orphans",
              "cd /opt/tares && docker compose --env-file .env -f docker-compose.yaml -f docker-compose.prod.yaml --profile prod ps"
            ]}')
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters "$command" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
