name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-progress deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false


jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Reuse the exact frontend build that CI tested and uploaded.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: client/dist

      - name: Upload frontend to S3
        run: aws s3 sync client/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete

      - name: Build and push backend images
        uses: ./.github/actions/build-backend
        with:
          registry: ${{ steps.ecr.outputs.registry }}
          tag: ${{ github.sha }}
          push: "true"

      - name: Deploy on EC2 via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: |
          CMD="cd /opt/tares && \
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY && \
            export REGISTRY=$REGISTRY IMAGE_TAG=$IMAGE_TAG && \
            docker compose -f docker-compose.prod.yaml pull && \
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -n --arg c "$CMD" '{commands: [$c]}')" \
            --query Command.CommandId --output text)

          # If the waiter times out, check the remote output with:
          # aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"