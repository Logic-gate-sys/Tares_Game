name: CI

on:
  workflow_call:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npx vite build

  user-service:
    name: User service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_platform/user_microservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend_platform/user_microservice/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run

  wss-service:
    name: WSS service checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_platform/wss_microservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend_platform/wss_microservice/go.sum
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./...

  docker:
    name: Validate backend images
    needs: [user-service, wss-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend_platform/user_microservice/Dockerfile -t tares-user-service:test .
      - run: docker build -f backend_platform/wss_microservice/Dockerfile -t tares-wss-service:test backend_platform/wss_microservice
