syntax = "proto3";
package user.v1;

option go_package = "github.com/logic-gate-sys/wss_service/pkg/user/v1;userpb";

service UserService {
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse); 
  rpc RecordCompletedMatch(RecordCompletedMatchRequest) returns (RecordCompletedMatchResponse);
}

message GetUserStatsRequest{
  int32 user_id=1;
}

message GetUserStatsResponse {
  string id =1;
  string name=2;
  string level=3;
  string rank=4;
  PlayerStats stats = 5;
}


message PlayerStats {
  int32 wins = 1;
  double accuracy=2;
}

message RecordCompletedMatchRequest {
  string match_id = 1;
  repeated MatchPlayerResult players = 2;
}

message MatchPlayerResult {
  int32 user_id = 1;
  int32 score = 2;
  int32 words_unscrambled = 3;
  bool won = 4;
}

message RecordCompletedMatchResponse {
  bool recorded = 1;
}
